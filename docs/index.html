<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Multilingual Bible reader — English, Tamil, and Sinhala with English speech playback." />
  <meta name="theme-color" content="#0f6b5c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bible Reader" />
  <title>Bible Reader</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-bar">
      <div class="toolbar-brand">Bible Reader</div>

      <div class="toolbar-nav">
        <label class="field field-inline">
          <span class="visually-hidden">Book</span>
          <select id="book-select" aria-label="Book"></select>
        </label>
        <label class="field field-inline">
          <span class="visually-hidden">Chapter</span>
          <select id="chapter-select" aria-label="Chapter"></select>
        </label>
      </div>

      <div class="toolbar-reader-compact" id="reader-controls">
        <button type="button" id="btn-prev" aria-label="Previous verse">Prev</button>
        <button type="button" id="btn-play" class="btn-primary" aria-label="Play or pause">Play</button>
        <button type="button" id="btn-next" aria-label="Next verse">Next</button>
      </div>

      <button
        type="button"
        id="menu-toggle"
        class="menu-toggle"
        aria-expanded="false"
        aria-controls="toolbar-menu"
      >
        Menu
      </button>
    </div>

    <div id="toolbar-menu" class="toolbar-menu" hidden>
      <div class="menu-section" role="group" aria-label="Languages">
        <p class="menu-heading">Languages</p>
        <div class="menu-row">
          <span class="lang-fixed" title="Always shown">English · NKJV</span>
          <label class="check">
            <input type="checkbox" id="toggle-tamil" checked />
            <span>Tamil</span>
          </label>
          <label class="check">
            <input type="checkbox" id="toggle-sinhala" checked />
            <span>Sinhala</span>
          </label>
        </div>
      </div>

      <div class="menu-section">
        <p class="menu-heading">Theme</p>
        <label class="field">
          <span class="visually-hidden">Theme</span>
          <select id="theme-select" aria-label="Theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="high-contrast">High contrast light</option>
            <option value="high-contrast-dark">High contrast dark</option>
          </select>
        </label>
      </div>

      <div class="menu-section">
        <p class="menu-heading">Voice</p>
        <label class="field">
          <span class="visually-hidden">Voice</span>
          <select id="voice-select" aria-label="Reading voice">
            <option value="">Loading voices…</option>
          </select>
        </label>
      </div>

      <div class="menu-section">
        <p class="menu-heading">Reading speed</p>
        <label class="field">
          <span class="visually-hidden">Speed</span>
          <select id="rate-select" aria-label="Reading speed">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
          </select>
        </label>
      </div>

      <p id="reader-status" class="reader-status" hidden></p>
    </div>
  </header>

  <main id="content" class="content" aria-live="polite">
    <p class="empty-state">Loading…</p>
  </main>

  <script src="js/reader.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
