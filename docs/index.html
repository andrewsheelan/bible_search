<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Multilingual Bible reader — English, Tamil, and Sinhala with English speech playback." />
  <meta name="theme-color" content="#0f6b5c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bible Reader" />
  <title>Bible Reader</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-bar">
      <div class="toolbar-brand">Bible Reader</div>

      <div class="toolbar-nav">
        <label class="field field-inline">
          <span class="visually-hidden">Book</span>
          <select id="book-select" aria-label="Book"></select>
        </label>
        <label class="field field-inline">
          <span class="visually-hidden">Chapter</span>
          <select id="chapter-select" aria-label="Chapter"></select>
        </label>
      </div>
    </div>

    <div id="plan-jump-bar" class="plan-jump-bar" hidden>
      <div class="plan-jump-main">
        <p class="plan-jump-title">
          <strong>Plan reading:</strong>
          <span id="plan-jump-label"></span>
        </p>
        <button type="button" id="plan-mark-complete" class="plan-complete-btn">Mark complete</button>
      </div>
      <div id="plan-jump-chips" class="plan-chips" hidden aria-label="Chapters in this reading"></div>
    </div>
  </header>

  <!-- Outside sticky/filtered header so position:fixed works on mobile -->
  <div class="player-dock" id="player-dock">
    <div class="toolbar-reader-compact" id="reader-controls">
      <button type="button" id="btn-prev" class="btn-tool" aria-label="Previous verse">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
        <span class="btn-text">Prev</span>
      </button>
      <button type="button" id="btn-play" class="btn-tool btn-primary" aria-label="Play">
        <svg class="btn-icon icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M8 5v14l11-7z"/>
        </svg>
        <svg class="btn-icon icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/>
        </svg>
        <span class="btn-text">Play</span>
      </button>
      <button type="button" id="btn-next" class="btn-tool" aria-label="Next verse">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
        </svg>
        <span class="btn-text">Next</span>
      </button>
    </div>

    <button
      type="button"
      id="menu-toggle"
      class="btn-tool menu-toggle"
      aria-expanded="false"
      aria-controls="toolbar-menu"
      aria-label="Menu"
    >
      <svg class="btn-icon icon-menu" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/>
      </svg>
      <svg class="btn-icon icon-close" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
      <span class="btn-text">Menu</span>
    </button>

    <button
      type="button"
      id="plan-toggle"
      class="btn-tool plan-toggle"
      aria-expanded="false"
      aria-controls="plan-panel"
      aria-label="Reading plan"
    >
      <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H5V8h14v13z"/>
      </svg>
      <span class="btn-text">Plan</span>
    </button>
  </div>

  <div id="toolbar-menu" class="toolbar-menu" hidden>
    <div class="menu-section" role="group" aria-label="Languages">
      <p class="menu-heading">Languages</p>
      <div class="menu-row">
        <span class="lang-fixed" title="Always shown">English · NKJV</span>
        <label class="check">
          <input type="checkbox" id="toggle-tamil" checked />
          <span>Tamil</span>
        </label>
        <label class="check">
          <input type="checkbox" id="toggle-sinhala" checked />
          <span>Sinhala</span>
        </label>
      </div>
    </div>

    <div class="menu-section">
      <p class="menu-heading">Theme</p>
      <label class="field">
        <span class="visually-hidden">Theme</span>
        <select id="theme-select" aria-label="Theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="high-contrast">High contrast light</option>
          <option value="high-contrast-dark">High contrast dark</option>
        </select>
      </label>
    </div>

    <div class="menu-section">
      <p class="menu-heading">Read in</p>
      <label class="field">
        <span class="visually-hidden">Read in</span>
        <select id="speech-lang-select" aria-label="Language to read aloud">
          <option value="en" selected>English</option>
          <option value="ta">Tamil</option>
        </select>
      </label>
    </div>

    <div class="menu-section">
      <p class="menu-heading">Voice</p>
      <label class="field">
        <span class="visually-hidden">Voice</span>
        <select id="voice-select" aria-label="Reading voice">
          <option value="">Loading voices…</option>
        </select>
      </label>
    </div>

    <div class="menu-section">
      <p class="menu-heading">Reading speed</p>
      <label class="field">
        <span class="visually-hidden">Speed</span>
        <select id="rate-select" aria-label="Reading speed">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </label>
    </div>

    <p id="reader-status" class="reader-status" hidden></p>
  </div>

  <div id="plan-panel" class="plan-panel" hidden>
    <div class="plan-sheet">
      <header class="plan-header">
        <div>
          <p class="plan-kicker">Self-paced</p>
          <h2 id="plan-title">Full Bible reading plan</h2>
        </div>
        <button type="button" id="plan-close" class="btn-tool" aria-label="Close reading plan">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </header>

      <div class="plan-status" id="plan-status"></div>
      <div class="plan-actions" id="plan-actions"></div>
      <div class="plan-filters" id="plan-filters" hidden>
        <button type="button" data-filter="next" class="is-active">Next</button>
        <button type="button" data-filter="open">To do</button>
        <button type="button" data-filter="done">Done</button>
        <button type="button" data-filter="all">All</button>
      </div>
      <div class="plan-list" id="plan-list"></div>
    </div>
  </div>

  <main id="content" class="content" aria-live="polite">
    <p class="empty-state">Loading…</p>
  </main>

  <script src="js/reader.js"></script>
  <script src="js/app.js"></script>
  <script src="js/plan.js"></script>
</body>
</html>
