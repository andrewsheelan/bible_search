<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bible Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-brand">Bible Reader</div>

    <div class="toolbar-nav">
      <label class="field">
        <span class="field-label">Book</span>
        <select id="book-select"></select>
      </label>
      <label class="field">
        <span class="field-label">Chapter</span>
        <select id="chapter-select"></select>
      </label>
    </div>

    <div class="toolbar-langs" role="group" aria-label="Languages">
      <span class="lang-fixed" title="Always shown">English · NKJV</span>
      <label class="check">
        <input type="checkbox" id="toggle-tamil" checked />
        <span>Tamil</span>
      </label>
      <label class="check">
        <input type="checkbox" id="toggle-sinhala" checked />
        <span>Sinhala</span>
      </label>
    </div>

    <div class="toolbar-theme">
      <label class="field">
        <span class="field-label">Theme</span>
        <select id="theme-select">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="high-contrast">High contrast</option>
        </select>
      </label>
    </div>

    <div class="toolbar-reader" id="reader-controls">
      <div class="reader-buttons">
        <button type="button" id="btn-prev" aria-label="Previous verse">Prev</button>
        <button type="button" id="btn-play" class="btn-primary" aria-label="Play or pause">Play</button>
        <button type="button" id="btn-next" aria-label="Next verse">Next</button>
      </div>
      <label class="field">
        <span class="field-label">Speed</span>
        <select id="rate-select">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </label>
      <p id="reader-status" class="reader-status" hidden></p>
    </div>
  </header>

  <main id="content" class="content" aria-live="polite">
    <p class="empty-state">Loading…</p>
  </main>

  <script src="js/reader.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
